name: juan_valdez
description: Juan Valdez Café dine-in visit tracking — browse menu, check in, track.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/explore/
    - assets/images/trending/
    - assets/icons/
    - assets/menuchip/
    - assets/cookies/
    - assets/croissant/
